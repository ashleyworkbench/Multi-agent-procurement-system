# =============================================================
# FULL MULTI-AGENT PROCUREMENT SYSTEM
# Agents 1-4 + Integration Layer + Kafka + Redis + DBs
# =============================================================

services:

  # -----------------------------------------------------------
  # INFRASTRUCTURE
  # -----------------------------------------------------------

  postgres:
    build:
      context: ./databases/postgres
      dockerfile: Dockerfile
    container_name: procurement_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - procurement_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql:
    build:
      context: ./databases/mysql
      dockerfile: Dockerfile
    container_name: procurement_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER:          ${MYSQL_USER}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - procurement_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: procurement_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - procurement_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: procurement_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME:   2000
    networks:
      - procurement_network
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: procurement_kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID:                        1
      KAFKA_ZOOKEEPER_CONNECT:                zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS:             PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:   PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME:       PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:        "true"
    ports:
      - "29092:29092"
    networks:
      - procurement_network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # -----------------------------------------------------------
  # SERVICES — Python healthchecks (no curl in slim images)
  # -----------------------------------------------------------

  ocr-service:
    build:
      context: ./services/ocr-service
      dockerfile: Dockerfile
    container_name: procurement_ocr_service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    ports:
      - "8001:8001"
    networks:
      - procurement_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  inventory-service:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    container_name: procurement_inventory_service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      MYSQL_HOST:    mysql
    ports:
      - "8002:8002"
    networks:
      - procurement_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  vendor-service:
    build:
      context: ./services/vendor-service
      dockerfile: Dockerfile
    container_name: procurement_vendor_service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      MYSQL_HOST:    mysql
    ports:
      - "8003:8003"
    networks:
      - procurement_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  api-gateway:
    build:
      context: ./services/integration-gateway
      dockerfile: Dockerfile
    container_name: procurement_api_gateway
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      vendor-service:
        condition: service_healthy
    env_file: .env
    environment:
      REDIS_HOST:            redis
      INVENTORY_SERVICE_URL: http://inventory-service:8002
      VENDOR_SERVICE_URL:    http://vendor-service:8003
      AGENT1_OCR_URL:        http://agent1-ocr:8009
    ports:
      - "8000:8000"
    networks:
      - procurement_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  procurement-service:
    build:
      context: ./services/procurement-service
      dockerfile: Dockerfile
    container_name: procurement_procurement_service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    ports:
      - "8004:8004"
    networks:
      - procurement_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -----------------------------------------------------------
  # MINIO — Document Storage for Agent 1
  # -----------------------------------------------------------

  minio:
    image: minio/minio:latest
    container_name: procurement_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - procurement_network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -----------------------------------------------------------
  # AGENT 1 — Document Intelligence (OCR + LLM)
  # -----------------------------------------------------------

  agent1-ocr:
    build:
      context: ./services/agent1-ocr
      dockerfile: Dockerfile
    container_name: procurement_agent1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_HOST:           postgres
      MINIO_ENDPOINT:          minio:9000
      AGENT1_DATABASE_URL:     postgresql://procurement_admin:SecurePass%402024@postgres:5432/ocr_procurement_db
    ports:
      - "8009:8009"
    networks:
      - procurement_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8009/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s



  agent2-inventory:
    build:
      context: ./services/agent2-inventory
      dockerfile: Dockerfile
    container_name: procurement_agent2
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      ocr-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INTEGRATION_GATEWAY_URL: http://api-gateway:8000
      OCR_SERVICE_URL:         http://ocr-service:8001
      REDIS_HOST:              redis
      ONBOARDING_SERVICE_URL:  http://onboarding-service:8000
    ports:
      - "8005:8005"
    networks:
      - procurement_network

  agent3-vendor:
    build:
      context: ./services/agent3-vendor
      dockerfile: Dockerfile
    container_name: procurement_agent3
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent2-inventory:
        condition: service_started
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INTEGRATION_GATEWAY_URL: http://api-gateway:8000
      REDIS_HOST:              redis
    ports:
      - "8006:8006"
    networks:
      - procurement_network

  agent4-procurement:
    build:
      context: ./services/agent4-procurement
      dockerfile: Dockerfile
    container_name: procurement_agent4
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      procurement-service:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent3-vendor:
        condition: service_started
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PROCUREMENT_SERVICE_URL: http://procurement-service:8004
      REDIS_HOST:              redis
    ports:
      - "8008:8008"
    networks:
      - procurement_network

  onboarding-service:
    build:
      context: ./services/onboarding-service
      dockerfile: Dockerfile
    container_name: procurement_onboarding
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    ports:
      - "8007:8000"
    networks:
      - procurement_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: procurement_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://api-gateway:8000
    ports:
      - "3000:3000"
    networks:
      - procurement_network
    depends_on:
      - api-gateway

volumes:
  postgres_data:
  mysql_data:
  redis_data:
  minio_data:

networks:
  procurement_network:
    driver: bridge
    name: procurement_network
